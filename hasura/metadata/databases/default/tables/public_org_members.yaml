table:
  name: org_members
  schema: public
object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: org_id
  - name: user
    using:
      foreign_key_constraint_on: user_id
select_permissions:
  - role: user
    permission:
      columns:
        - role
        - created_at
        - id
        - org_id
        - user_id
      filter:
        user_id:
          _eq: X-Hasura-User-Id
    comment: ""
