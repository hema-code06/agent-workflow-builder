table:
  name: workflow_steps
  schema: public
object_relationships:
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
insert_permissions:
  - role: user
    permission:
      check:
        _or:
          - _and:
              - workflow:
                  organization:
                    org_members:
                      user_id:
                        _eq: X-Hasura-User-Id
              - workflow:
                  organization:
                    org_members:
                      role:
                        _eq: owner
          - _and:
              - workflow:
                  organization:
                    org_members:
                      user_id:
                        _eq: X-Hasura-User-Id
              - workflow:
                  organization:
                    org_members:
                      role:
                        _eq: editor
              - step_type:
                  _nin:
                    - db_write
                    - notify
      columns:
        - step_order
        - config
        - step_type
        - created_at
        - id
        - workflow_id
    comment: ""
select_permissions:
  - role: user
    permission:
      columns:
        - step_order
        - config
        - step_type
        - created_at
        - id
        - workflow_id
      filter:
        workflow:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
    comment: ""
